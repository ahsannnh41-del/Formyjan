<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will You Be Mine?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <audio id="bgMusic" loop preload="auto">
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <div class="hearts-container" id="hearts"></div>

  <div class="card" id="card1">
    <p class="tagline">A SMALL QUESTION</p>
    <h1>Will you be mine?</h1>
    <p class="description">
      There's only one honest answer here — the other one's a little shy and won't sit still long enough to be picked.
    </p>

    <div class="buttons-wrapper">
      <button id="yesBtn" onclick="nextScreen()">Yes</button>
      <button id="noBtn">No</button>
    </div>

    <p class="sub-text" id="hintText">psst — try clicking "No"</p>
  </div>

  <div class="card hidden" id="card2">
    <p class="tagline">IT'S OFFICIAL</p>
    <h1>Please be mine</h1>
    <p class="description">Consider this Yes notarized.</p>

    <div class="sticker-container">
      <img src="https://media0.giphy.com/media/v1.Y2lkPTZjMDliOTUycXhiZWd0MThzYTV1bTlsN2x0dTRmZGxzbmtjNnZta2dhdDJudjNscyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MDJ9IbxxvDUQM/giphy.gif" alt="Kissing Cat Sticker" class="cat-sticker">
      <div class="sticker-badge">*Muah*</div>
    </div>

    <button id="continueBtn" onclick="finish()">Continue</button>
  </div>

  <script src="script.js"></script>
</body>
  </html>
